<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pet-window-proto</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    font: 11px/1.35 sans-serif;
  }
  /* 仮の絵: 横128×縦192(CSSピクセル)。向きは三角の印で示す */
  #pet {
    position: absolute;
    left: 0;
    top: 0;
    width: 128px;
    height: 192px;
    box-sizing: border-box;
    border: 3px solid #2f4a3a;
    background: rgba(107, 142, 115, 0.92);
    color: #f3efe4;
    cursor: grab;
  }
  #pet.grabbed { cursor: grabbing; background: rgba(214, 140, 62, 0.92); }
  #arrow {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 16px solid #f3efe4;
  }
  #pet.left #arrow { left: 8px; right: auto; border-left: none; border-right: 16px solid #f3efe4; }
  #info { position: absolute; left: 6px; right: 6px; bottom: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="pet"><div id="arrow"></div><div id="info"></div></div>
<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const pet = document.getElementById("pet");
  const info = document.getElementById("info");
  const mode = window.PET_MODE || "a";
  let state = "";
  let stats = null;

  // 画面の描画の間隔(requestAnimationFrame)も測る
  let frames = 0;
  let frameSum = 0;
  let prevFrame = performance.now();
  let rafAvg = 0;
  function onFrame(t) {
    frameSum += t - prevFrame;
    prevFrame = t;
    frames += 1;
    if (frames >= 30) {
      rafAvg = frameSum / frames;
      frames = 0;
      frameSum = 0;
    }
    requestAnimationFrame(onFrame);
  }
  requestAnimationFrame(onFrame);

  function render() {
    const s = stats;
    info.textContent = [
      `方式 ${mode.toUpperCase()} / ${state}`,
      s ? `無操作 ${s.idle_seconds.toFixed(1)}秒` : "",
      s ? `計算 平均${s.tick_avg_ms.toFixed(1)} 最大${s.tick_max_ms.toFixed(1)}ms` : "",
      `描画 ${rafAvg.toFixed(1)}ms`,
      s ? `拡大率 ${s.scale}` : "",
      s && mode === "b" ? `クリック ${s.ignoring ? "通す" : "受ける"}` : "",
    ].filter(Boolean).join("\n");
  }

  listen("pet", (e) => {
    const p = e.payload;
    if (mode === "b") {
      pet.style.transform = `translate(${p.x}px, ${p.y}px)`;
    }
    pet.classList.toggle("left", p.facing < 0);
    pet.classList.toggle("grabbed", p.state === "つままれる");
    state = p.state;
  });
  listen("stats", (e) => {
    stats = e.payload;
    console.log(JSON.stringify(stats));
    render();
  });

  pet.addEventListener("mousedown", (e) => {
    if (e.button === 0) invoke("grab");
  });
  pet.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    invoke("quit");
  });
</script>
</body>
</html>
