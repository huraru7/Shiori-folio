[package]
name = "shiori-folio"
version = "0.1.0"
description = "詩織（Shiori-folio）"
authors = ["you"]
edition = "2021"
# src/bin/(mcp_server.rs, shiori_save.rs)が増えて同一パッケージ内に複数の
# バイナリターゲットが存在するようになったため、`cargo tauri build`が
# GUI本体(shiori-folio、src/main.rs由来)ではなくsrc/bin/側を誤って
# アプリバンドルの実行ファイルとして選んでしまう不具合が発生した
# (2026-08-15、USB版Ver2.0更新作業で発覚)。default-runで明示して回避する。
default-run = "shiori-folio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shiori_folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
cpal = "0.15"
hound = "3.5"
rodio = "0.19"
sysinfo = "0.32"
fs4 = { version = "0.13", features = ["sync"] }
# Ver2.0(セカンドブレイン化)のMCPサーバー(src/bin/mcp_server.rs)向け。
# GUI本体(shiori-folioバイナリ)は使わないが、同じCargoパッケージ内の別
# バイナリ(src/bin/*)として実装するため[dependencies]を共有する。
rmcp = { version = "3", features = ["transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
anyhow = "1"
# 保存CLI(src/bin/shiori_save.rs)のfrontmatter・tags.yaml/projects.yaml解析向け。
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

